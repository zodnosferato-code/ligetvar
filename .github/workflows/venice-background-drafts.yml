name: Generate Venice background drafts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/venice-background-drafts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate three background drafts
        run: node scripts/venice-restyle-backgrounds.mjs
        env:
          IMAGE_GENERATOR_KEY: ${{ secrets.IMAGE_GENERATOR_KEY }}
      - name: Upload drafts for review
        uses: actions/upload-artifact@v4
        with:
          name: venice-background-drafts
          path: artifacts/venice-backgrounds/
          if-no-files-found: error
          retention-days: 14
