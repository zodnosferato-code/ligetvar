name: Generate Venice background drafts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate three environment-only background drafts
        run: node scripts/venice-restyle-backgrounds.mjs
        env:
          IMAGE_GENERATOR_KEY: ${{ secrets.IMAGE_GENERATOR_KEY }}
      - name: Upload drafts for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venice-background-drafts-pov
          path: artifacts/venice-backgrounds/
          if-no-files-found: ignore
          retention-days: 14
